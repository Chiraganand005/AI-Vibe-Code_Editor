<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Premium Neon Gradients -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="30%" stop-color="#FF2D55" />
      <stop offset="70%" stop-color="#AF52DE" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>
    
    <linearGradient id="logo-grad-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C7BE" />
      <stop offset="50%" stop-color="#30B0C7" />
      <stop offset="100%" stop-color="#34C759" />
    </linearGradient>

    <linearGradient id="logo-grad-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5856D6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>
  </defs>

  <!-- Background Soft Glow Aura -->
  <circle cx="50" cy="50" r="25" fill="url(#logo-grad-glow)" filter="url(#soft-glow)" opacity="0.3" />

  <!-- Outer Hexagonal Cyber Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           stroke="url(#logo-grad-accent)" 
           stroke-width="1.5" 
           stroke-dasharray="4 6 12 6" 
           opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="40s" repeatCount="indefinite" />
  </polygon>

  <!-- Left Code Bracket Ribbon '<' -->
  <path d="M 40,28 L 22,50 L 40,72" 
        stroke="url(#logo-grad-primary)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neon-glow)" />

  <!-- Right Code Bracket Ribbon '>' -->
  <path d="M 60,28 L 78,50 L 60,72" 
        stroke="url(#logo-grad-primary)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neon-glow)" />

  <!-- Center Floating Neon V-Core -->
  <path d="M 36,44 L 50,65 L 64,44" 
        stroke="url(#logo-grad-accent)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neon-glow)" />

  <!-- Glowing Sparkle / AI Node -->
  <circle cx="50" cy="30" r="3.5" fill="#FFFFFF" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="2.5;4;2.5" dur="2.5s" repeatCount="indefinite" />
  </circle>
</svg>
